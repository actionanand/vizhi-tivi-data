name: Vizhi TiVi Data - Weekly source review

on:
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate editorial sources
        run: npm run validate
      - name: Scan reviewed stream endpoints and official directories
        run: npm run scan:weekly
      - name: Attach review-only report (never auto-approve stream rights)
        uses: actions/upload-artifact@v4
        with:
          name: vizhi-tivi-weekly-research-${{ github.run_id }}
          path: reports/weekly-scan.json
          retention-days: 7
          if-no-files-found: error
